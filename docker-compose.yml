services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: retirement-copilot-pgvector
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: retirement_copilot
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d retirement_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
